name: actualizar-historico
on:
  schedule:
    - cron: '0 14 * * *' # 9am Colombia
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps
      - name: Actualizar historico
        run: npm run update-history
      - name: Commit cambios
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/
          git commit -m "update historico $(date)" || exit 0
          git push
