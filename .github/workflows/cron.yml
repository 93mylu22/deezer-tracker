name: Deezer Tracker Cron

on:
  schedule:
    # 14:00 UTC = 9:00 am hora Bogotá (UTC-5)
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar-historico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar cron de Deezer
        run: npm run cron

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit y push si hay cambios
        run: |
          git add data/historico.json
          if git diff --cached --quiet; then
            echo "Sin cambios en historico.json, no se hace commit."
          else
            git commit -m "chore: actualizar historico $(date -u +'%Y-%m-%d')"
            git push
          fi
